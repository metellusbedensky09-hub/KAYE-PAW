<style>

.rc{padding:20px}

:root{--bg:#fff;--card:#fff;--ink:#0B2A5B;--mute:#5E6F8A;--line:#DCE7F5;--blue:#1257D6;--onblue:#fff;--shadow:0 1px 2px rgba(18,87,214,.07),0 6px 18px rgba(18,87,214,.08)}

:root{--bg:#EDF1F9;--teal:#0F8A7E;--gold:#E0A100}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--teal:#3CC9B8;--gold:#F2C14E}}

body{padding-bottom:104px}

body{padding-bottom:0}

<body>
<header class="top"><div><div class="bar"><button class="hb" id="hb" aria-label="Meni"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><span class="brand" id="brand">Kaye</span><span class="dnow" id="dnow"></span><button class="avb" id="avb" data-act="go" data-id="profil" aria-label="Profil"></button></div><div class="lbl">Vant jodi a</div><div class="big" id="today">0 G</div><div class="pft" id="pft"></div><div class="who" id="who"></div></div></header>
<main id="app"></main>
<div id="toast" role="status"></div>
<datalist id="cl"></datalist>
<input type="file" id="pf" accept="image/*" hidden>
<nav>
<button data-tab="tablo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Tablo</button>
<button data-tab="vant"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2l2.4 11h11l2-8H6.2"/></svg>Vant</button>
<button data-tab="stok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>Stok</button>
<button data-tab="kliyan"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3.2-5.5 6.5-5.5s6 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .7 3.2 2.5 3.5 5.2"/></svg>Kliyan</button>
<button data-tab="profil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.6-4 3.8-6 8-6s7.4 2 8 6"/></svg>Profil</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('fr-FR')+' '+(S.settings.cur||'G');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const K='kaye-v1';
const mk=()=>({products:[],sales:[],debts:[],clients:[],profile:{name:'',shop:'',phone:'',addr:'',photo:''},auth:{email:'',in:false},settings:{cur:'G',low:3,foot:'Mèsi, a pwochen!',theme:'auto'}});
function norm(o){o=o&&typeof o==='object'?o:{};const r=Object.assign(mk(),o);r.profile=Object.assign(mk().profile,o.profile);r.settings=Object.assign(mk().settings,o.settings);r.auth=Object.assign(mk().auth,o.auth);return r}
let S=mk();

const save=()=>{if(!UID)return;try{localStorage.setItem('kaye-u-'+UID,JSON.stringify(S))}catch(e){}};
const TABS=['tablo','vant','stok','kliyan','det','resi','profil','param','konfig'];
let tab=TABS.includes(location.hash.slice(1))?location.hash.slice(1):'tablo';
let cart={};
const day0=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
const sum=(a,b=Infinity)=>S.sales.filter(s=>s.t>=a&&s.t<b&&!s.credit).reduce((x,s)=>x+s.total,0);
const num=id=>{const v=parseFloat(String($(id).value).replace(',','.'));return isFinite(v)&&v>0?v:0};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2000)}
const cartTotal=()=>Object.entries(cart).reduce((a,[id,q])=>{const p=S.products.find(p=>p.id===id);return a+(p?p.price*q:0)},0);

function vant(){
 const tiles=S.products.map(p=>{const q=cart[p.id]||0,left=p.qty-q;
  return `<button class="tile" data-act="add" data-id="${p.id}" ${left<=0?'disabled':''}>${q?`<em class="badge">${q}</em>`:''}<i class="av" style="--h:${hue(p.name)}">${esc(p.name.trim().charAt(0).toUpperCase())}</i><b>${esc(p.name)}</b><span>${fmt(p.price)}</span><span>${left<=0?'Fini':left+' rete'}</span></button>`}).join('');
 const ct=cartTotal();
 return `<div class="card"><h2>Vant rapid</h2><div class="row"><input id="qa" inputmode="decimal" placeholder="Montan an gourd"><button class="btn" data-act="quick">Anrejistre</button></div></div>
 <h2>Pwodwi</h2>${tiles?`<div class="grid">${tiles}</div>`:`<div class="card empty"><b>Pa gen pwodwi ankò</b><span class="mute">Ajoute pwodwi w yo pou vann yo ak yon sèl tap.</span><button class="btn" data-act="go" data-id="stok">Ajoute premye pwodwi a</button></div>`}
 ${ct?`<div class="card" style="margin-top:12px"><div class="item"><b>Total</b><b>${fmt(ct)}</b></div><div class="col" style="margin-bottom:10px"><input id="cn" list="cl" placeholder="Kliyan (si gen)"><label class="row mute"><input type="checkbox" id="cr"> Kredi: kliyan an ap peye pita</label></div><div class="row"><button class="btn ghost" data-act="clear">Vide</button><button class="btn" style="flex:1" data-act="sell">Anrejistre vant</button></div></div>`:''}`;
}
function stok(){
 return `<div class="card"><h2>Ajoute yon pwodwi</h2><div class="col"><input id="pn" placeholder="Non pwodwi"><div class="row"><input id="pp" inputmode="decimal" placeholder="Pri (G)"><input id="pq" inputmode="numeric" placeholder="Kantite"></div><button class="btn" data-act="addp">Ajoute</button></div></div>
 <div class="card"><h2>Stok ou</h2>${S.products.length?S.products.map(p=>`<div class="item"><div><b>${esc(p.name)}</b><div class="mute">${fmt(p.price)}${p.qty<=S.settings.low?' <span class="red">Prèske fini</span>':''}</div></div><div class="row"><button class="btn ghost sm" data-act="dec" data-id="${p.id}" aria-label="Retire youn">−</button><b>${p.qty}</b><button class="btn ghost sm" data-act="inc" data-id="${p.id}" aria-label="Ajoute youn">+</button><button class="btn ghost sm" data-act="delp" data-id="${p.id}">Efase</button></div></div>`).join(''):'<div class="mute">Pa gen pwodwi ankò.</div>'}</div>`;
}
function det(){
 const open=S.debts.filter(d=>!d.paid),tot=open.reduce((a,d)=>a+d.amount,0);
 return `<div class="card"><h2>Nouvo dèt</h2><div class="col"><input id="dn" list="cl" placeholder="Non moun nan"><input id="da" inputmode="decimal" placeholder="Konbyen li dwe (G)"><button class="btn" data-act="addd">Ajoute</button></div></div>
 <div class="card"><h2>Moun ki dwe w ${open.length?`<span class="red">${fmt(tot)}</span>`:''}</h2>${open.length?open.map(d=>`<div class="item"><div><b>${esc(d.name)}</b><div class="mute">${new Date(d.t).toLocaleDateString('fr-FR')}</div></div><div class="row"><b class="red">${fmt(d.amount)}</b><button class="btn ghost sm" data-act="remind" data-id="${d.id}">Rapèl</button><button class="btn sm" data-act="paid" data-id="${d.id}">Peye</button></div></div>`).join(''):'<div class="mute">Pa gen dèt ouvè. Ajoute youn lè yon kliyan pran sou kredi.</div>'}</div>`;
}
function rapo(){
 const t0=day0(),D=864e5,names=['Dim','Len','Mad','Mèk','Jed','Van','Sam'];

 }
 else if(a==='quick'){
  const v=num('#qa');if(!v){toast('Antre yon montan');return}
  S.sales.push({id:uid(),t:Date.now(),total:v,items:[{name:'Vant rapid',qty:1,price:v}]});toast('Vant anrejistre');
 }
 else if(a==='addp'){
  const n=$('#pn').value.trim(),pr=num('#pp'),q=parseInt($('#pq').value,10)||0;
  if(!n||!pr){toast('Mete non ak pri');return}
  S.products.push({id:uid(),name:n,price:pr,cost:num('#pc'),qty:q});toast('Pwodwi ajoute');
 }
 else if(a==='rc'){rid=id;tab='rec';window.scrollTo(0,0)}
 else if(a==='go'){tab=id;window.scrollTo(0,0)}
 else if(a==='amode'){am=id;loginUI();return}
 else if(a==='reg'||a==='login'||a==='reset'){
  if(!window.FB){toast('Pa gen entènèt. Eseye ankò.');return}
  const em=$('#em').value.trim(),pw=$('#pw')?$('#pw').value:'',shop=$('#rs')?$('#rs').value.trim():'';
  if(!em){toast('Mete imèl ou');return}
  if(a==='reg'&&!shop){toast('Mete non biznis la');return}
  if(a!=='reset'&&!pw){toast('Mete mo pas la');return}
  b.disabled=true;if(a==='reg')pendingShop=shop;
  try{
   if(a==='reg'){const c=await FB.createUserWithEmailAndPassword(FB.auth,em,pw);try{await FB.updateProfile(c.user,{displayName:shop})}catch(e){}}
   else if(a==='login')await FB.signInWithEmailAndPassword(FB.auth,em,pw);
   else{await FB.sendPasswordResetEmail(FB.auth,em);toast('Nou voye yon imèl pou chanje mo pas la');am='login';loginUI()}
  }catch(err){pendingShop='';toast(aerr(err))}
  b.disabled=false;return}
 else if(a==='out'){document.body.classList.remove('dopen');try{if(window.FB)await FB.signOut(FB.auth);else window.onAuth(null)}catch(e){window.onAuth(null)}return}
 else if(a==='pic'){$('#pf').click();return}
 else if(a==='delpic'){S.profile.photo='';toast('Foto retire')}
 else if(a==='edp')epid=id;
 else if(a==='cnl')epid=null;
 else if(a==='svp'&&p){const n=$('#en').value.trim();if(n)p.name=n;p.cost=parseFloat(String($('#ec').value).replace(',','.'))||0;p.price=num('#ep')||p.price;epid=null;toast('Anrejistre')}
 else if(a==='cm'){if(cart[id]>1)cart[id]--;else delete cart[id]}
 else if(a==='back')tab='vant';
 else if(a==='sub'){sub=id;armed=false}
 else if(a==='addc'){const n=$('#cnm').value.trim();if(!n){toast('Mete non kliyan');return}addClient(n,$('#cph').value.trim());toast('Kliyan ajoute')}
 else if(a==='delc')S.clients=S.clients.filter(x=>x.id!==id);
 else if(a==='savep'){Object.assign(S.profile,{name:$('#fn').value.trim(),shop:$('#fs').value.trim(),phone:$('#fp').value.trim(),addr:$('#fa').value.trim()});toast('Profil anrejistre')}
 else if(a==='saves'){S.settings={cur:$('#sc').value.trim()||'G',low:Math.max(0,parseInt($('#sl').value,10)||0),foot:$('#sf').value.trim(),theme:$('#st').value};toast('Paramèt anrejistre')}
 else if(a==='copyr'||a==='sharer'){const s=S.sales.find(x=>x.id===rid);if(!s)return;const m=rtext(s);
  if(a==='sharer'&&navigator.share){navigator.share({text:m}).catch(()=>{})}else{try{navigator.clipboard.writeText(m).then(()=>toast('Resi kopye'),()=>toast('Pa ka kopye'))}catch(err){toast('Pa ka kopye')}}
  return}
 else if(a==='exp'){try{navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('Done yo kopye'),()=>toast('Pa ka kopye'))}catch(err){toast('Pa ka kopye')}return}
 else if(a==='imp'){try{const au=S.auth;S=norm(JSON.parse($('#imp').value));S.auth=au;toast('Done yo restore')}catch(err){toast('Done yo pa bon');return}}
 else if(a==='wipe'){if(!armed){armed=true;clearTimeout(window._wh);window._wh=setTimeout(()=>{armed=false;if(tab==='plis')render()},4000)}else{const au=S.auth,pr=S.profile;S=mk();S.auth=au;S.profile=pr;cart={};armed=false;toast('Tout done efase')}}
 else if(a==='inc'&&p)p.qty++;
 else if(a==='dec'&&p)p.qty=Math.max(0,p.qty-1);
 else if(a==='delp'){S.products=S.products.filter(x=>x.id!==id);delete cart[id];toast('Pwodwi efase')}
 else if(a==='addd'){
  const n=$('#dn').value.trim(),v=num('#da');
  if(!n||!v){toast('Mete non ak montan');return}
  addClient(n);S.debts.push({id:uid(),name:n,amount:v,t:Date.now(),paid:false});toast('Dèt ajoute');
 }
 else if(a==='paid'){
  const d=S.debts.find(x=>x.id===id);
  if(d){d.paid=true;S.sales.push({id:uid(),t:Date.now(),total:d.amount,profit:((S.sales.find(x=>x.id===d.sid)||{}).profit)||0,items:[{name:'Peman dèt '+d.name,qty:1,price:d.amount}]});toast('Dèt peye')}
 }
 else if(a==='remind'){
  const d=S.debts.find(x=>x.id===id);
  if(d){const m='Bonjou '+d.name+', se yon ti rapèl: ou dwe m '+fmt(d.amount)+'. Mèsi!';
   try{navigator.clipboard.writeText(m).then(()=>toast('Mesaj la kopye'),()=>toast(m))}catch(err){toast(m)}}
  return;
 }
 save();render();
});
document.addEventListener('input',e=>{const t=e.target;if(t.id!=='sk'&&t.id!=='vs')return;if(t.id==='sk')sq=t.value;else vq=t.value;render();const n=$('#'+t.id);if(n){n.focus();const l=n.value.length;n.setSelectionRange(l,l)}});
document.addEventListener('change',e=>{const t=e.target;if(t.classList.contains('qn')){const p=S.products.find(x=>x.id===t.dataset.id);if(p){const v=Math.min(p.qty,parseInt(t.value,10)||0);if(v>0)cart[p.id]=v;else delete cart[p.id];render()}}});
$('#pf').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(im.width,im.height);c.width=c.height=256;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);S.profile.photo=c.toDataURL('image/jpeg',.82);save();render();toast('Foto anrejistre')};im.onerror=()=>toast('Foto a pa bon');im.src=r.result};r.readAsDataURL(f);e.target.value=''});
render();
</script>
